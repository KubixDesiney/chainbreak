# CHAINBREAK OpenSSF Scorecard
#
# Runs the OpenSSF Scorecard supply-chain checks against this repository and
# publishes the result to the public Scorecard dashboard (scorecard.dev) and
# to GitHub code scanning. Read-only: this workflow never mutates the repo.
#
# Action pinning: every third-party action here is pinned to a full commit
# SHA, matching the invariant ci.yml's `guards` job enforces for the other
# workflows (scripts/check_github_action_pins.py).

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 6" # weekly, Saturday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Required by ossf/scorecard-action to publish results to the public
      # dashboard (id-token) and to upload the SARIF to code scanning
      # (security-events). Nothing else is granted.
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: results.sarif
