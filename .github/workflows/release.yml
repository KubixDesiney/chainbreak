# Publishes CHAINBREAK to PyPI through GitHub Trusted Publishing (OIDC).
#
# There is no PyPI API token for this project and none should be created. The
# only credential is a short-lived OIDC token GitHub mints for this workflow at
# run time, which PyPI accepts solely because it matches a trusted-publisher
# record. That record must name, exactly:
#
#   owner:       KubixDesiney
#   repository:  chainbreak
#   workflow:    release.yml
#   environment: pypi
#
# Renaming or moving this file therefore breaks publishing until the record on
# PyPI is updated to match. The `pypi` environment must exist in the repository
# settings; its protection rules (required reviewer, tag-only deployment) are
# the control that stops a merged pull request from publishing on its own.
#
# PyPI versions are immutable: an uploaded artifact can be yanked but never
# replaced. Every gate below therefore runs *before* the publish job, and the
# publish job receives the exact artifacts those gates inspected.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m build --outdir dist

      - name: Smoke-test the installed wheel
        run: python scripts/smoke_installed_wheel.py dist/*.whl

      - name: Check distribution contents
        run: python scripts/check_dist_contents.py dist

      # readme_renderer[md] is not optional here. twine's own dependency pulls
      # readme_renderer without the Markdown extra, and `twine check` then
      # reports PASSED having rendered nothing at all -- a green gate that
      # verifies the description is valid Markdown by never looking at it.
      #
      # These two are the only unhashed installs in the repository. They are
      # check-only tools that touch no credential and produce no artifact, and
      # they run after the artifacts are already built. Locking them properly
      # needs the Linux-container procedure documented in
      # scripts/lock_from_report.py.
      - name: Check metadata and README rendering
        run: |
          python -m pip install "twine==7.0.0" "readme_renderer[md]==46.0"
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chainbreak
    permissions:
      # The entire credential. `contents` stays unset (and therefore none):
      # this job downloads a built artifact and uploads it, and never needs
      # the source tree.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
