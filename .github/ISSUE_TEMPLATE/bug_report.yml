name: Bug report
description: Something in CHAINBREAK itself is broken — the CLI, a provider adapter, scoring, reporting, or the test/CI apparatus.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if this is a security-relevant defect (credential handling,
        namespace escape, acting outside the account allowlist, anything in the SI-*
        list in [SECURITY_MODEL.md](https://github.com/KubixDesiney/chainbreak/blob/main/SECURITY_MODEL.md)),
        stop and use **private vulnerability reporting** (Security tab → "Report a
        vulnerability") instead — see [SECURITY.md](https://github.com/KubixDesiney/chainbreak/blob/main/SECURITY.md).

        **Never paste credentials, account IDs, ARNs, or raw evidence bundles here.**
        This is a public issue tracker.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal command(s) that trigger it. Prefer `--provider fake` reproductions — they don't require an AWS account and are far easier for a maintainer to run.
      placeholder: |
        chainbreak run --provider fake --seed 1729 ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CHAINBREAK version
      description: Output of `chainbreak --version`, or the commit SHA if running from source.
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - fake
        - aws
        - both / not applicable
    validations:
      required: true

  - type: input
    id: python-os
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12.4, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: >-
        Redact anything account-specific. If in doubt, run it through
        `chainbreak`'s own redaction path before pasting rather than by hand.
      render: shell
