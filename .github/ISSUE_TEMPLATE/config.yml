blank_issues_enabled: false
contact_links:
  - name: 🔒 Report a security vulnerability
    url: https://github.com/KubixDesiney/chainbreak/security/advisories/new
    about: >-
      Do not open a public issue for a security-relevant defect. Use GitHub's
      private vulnerability reporting instead — see SECURITY.md for what to
      include.
  - name: Discuss the methodology before filing
    url: https://github.com/KubixDesiney/chainbreak/blob/main/CONTRIBUTING.md
    about: >-
      For anything larger than a typo or obvious bug fix, CONTRIBUTING.md asks
      you to open an issue describing the problem before writing code.
