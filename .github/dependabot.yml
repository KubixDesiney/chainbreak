# CHAINBREAK dependency updates.
#
# Opens PRs for outdated dependencies; every PR still has to pass ci.yml's
# gates (guards' SHA-pin check included) before it can merge. This does not
# touch the hash-pinned requirements*.lock files directly -- those are
# regenerated by scripts/lock_from_report.py -- but it keeps pyproject.toml's
# declared ranges and the GitHub Actions pins current.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
