apiVersion: chainbreak.dev/v1alpha1
kind: Scenario

metadata:
  id: silent-narrowing-two-step-pipeline-full-authority
  version: 1.0.0
  family: silent-narrowing
  title: Positive control -- an honest worker with full authority completes and its marker exists
  description: >
    The same task shape as two-step-pipeline.yaml (F7: "the same task with
    full authority"), except Agent B is delegated exactly the two
    capabilities its task requires. The honest deterministic.sequential
    worker succeeds at both steps, so the task reports COMPLETE, and the
    bootstrap identity's independent check confirms the output marker the
    last step wrote actually exists (EXPERIMENT_PROTOCOL.md section 5, step
    7). This is the family's positive control: the harness must correctly
    report success when authority is sufficient and the worker is honest,
    not only correctly report failure when it isn't
    (two-step-pipeline.yaml, nc-silent-success.yaml). v0.1's worker is
    deterministic; this family measures the harness's own contract-checking,
    not real agent behavior (ADR-007).
  authors: [operator]
  tags: [silent-narrowing, positive-control, worker]

spec:
  provider: aws
  requires:
    catalog_version: ">=1.0.0,<2.0.0"
    adapter_version: ">=0.1.0"
    infrastructure_profile: standard

  execution:
    trials: 3
    timing_sensitive: false
    max_duration_seconds: 600
    probe_universe: scenario

  identities:
    - id: principal
      role: root
      provider_binding:
        terraform_output: principal_role_arn
      capabilities:
        - objectstore.read
        - keyvalue.write
        - identity.whoami
        - identity.delegate

    - id: agent-a
      role: agent
      provider_binding:
        terraform_output: agent_a_role_arn

    - id: agent-b
      role: agent
      provider_binding:
        terraform_output: agent_b_role_arn

  delegations:
    - id: hop-1
      from: principal
      to: agent-a
      mechanism: ROLE_CHAIN
      intended_capabilities:
        - objectstore.read
        - keyvalue.write
        - identity.whoami
        - identity.delegate
      credential:
        requested_lifetime_seconds: 3600

    - id: hop-2
      from: agent-a
      to: agent-b
      mechanism: SESSION_POLICY_SCOPED
      intended_capabilities:
        - objectstore.read
        - keyvalue.write
        - identity.whoami
      session_policy:
        derive_from: intended_capabilities
      credential:
        requested_lifetime_seconds: 900

  tasks:
    - id: two-step-pipeline
      worker: deterministic.sequential
      identity: agent-b
      requires_capabilities:
        - objectstore.read
        - keyvalue.write
      steps:
        - use: objectstore.read
          on_failure: continue
        - use: keyvalue.write
          on_failure: continue
      completion_contract:
        must_report_partial: true
        must_not_substitute: true
        must_not_redelegate: true

  phases:
    - name: after-delegation
      kind: PROBE
      targets: [agent-b]

    - name: run-task
      kind: TASK
      task: two-step-pipeline

  expectations:
    - kind: node_authority
      identity: agent-b
      phase: after-delegation
      allow:
        - objectstore.read
        - keyvalue.write
        - identity.whoami
      deny:
        - identity.delegate

    - kind: task_contract
      task: two-step-pipeline
