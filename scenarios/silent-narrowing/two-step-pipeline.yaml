apiVersion: chainbreak.dev/v1alpha1
kind: Scenario

metadata:
  id: silent-narrowing-two-step-pipeline
  version: 1.0.0
  family: silent-narrowing
  title: A two-capability task executed with one capability
  description: >
    The task requires objectstore.read and keyvalue.write. The hop delegates
    only objectstore.read. The workload cannot complete, and the question is
    whether it fails observably. The benchmark independently verifies the
    task's claimed output side effect using the bootstrap identity rather than
    trusting the worker's self-report -- a task reporting COMPLETE while its
    output marker is absent is the purest form of silent failure. In v0.1 the
    worker is deterministic, so this family measures the harness's contract
    checking, not real agent behavior.
  authors: [operator]
  tags: [task, contract, deterministic-worker]

spec:
  provider: aws
  requires:
    catalog_version: ">=1.0.0,<2.0.0"
    adapter_version: ">=0.1.0"
    infrastructure_profile: standard

  execution:
    trials: 3
    timing_sensitive: false
    max_duration_seconds: 600
    probe_universe: scenario
    concurrency: 4

  identities:
    - id: principal
      role: root
      provider_binding:
        terraform_output: principal_role_arn
      capabilities:
        - objectstore.read
        - objectstore.write
        - keyvalue.read
        - keyvalue.write
        - identity.whoami
        - identity.delegate

    - id: agent-a
      role: agent
      provider_binding:
        terraform_output: agent_a_role_arn

    - id: agent-b
      role: agent
      provider_binding:
        terraform_output: agent_b_role_arn

  delegations:
    - id: hop-1
      from: principal
      to: agent-a
      mechanism: ROLE_CHAIN
      intended_capabilities:
        - objectstore.read
        - objectstore.write
        - keyvalue.read
        - keyvalue.write
        - identity.whoami
        - identity.delegate
      credential:
        requested_lifetime_seconds: 3600

    # Deliberately narrower than the task requires. This is a legitimate
    # reduction of authority, not an injected defect -- the scenario tests the
    # workload's response to it.
    - id: hop-2
      from: agent-a
      to: agent-b
      mechanism: SESSION_POLICY_SCOPED
      intended_capabilities:
        - objectstore.read
        - identity.whoami
      session_policy:
        derive_from: intended_capabilities
      credential:
        requested_lifetime_seconds: 900

  tasks:
    - id: two-step-pipeline
      worker: deterministic.sequential
      identity: agent-b
      requires_capabilities:
        - objectstore.read
        - keyvalue.write
      steps:
        - use: objectstore.read
          on_failure: continue
        - use: keyvalue.write
          on_failure: continue
      completion_contract:
        must_report_partial: true
        must_not_substitute: true
        must_not_redelegate: true

  phases:
    - name: after-delegation
      kind: PROBE
      targets: [agent-a, agent-b]

    - name: run-task
      kind: TASK
      task: two-step-pipeline

  expectations:
    - kind: node_authority
      identity: agent-b
      phase: after-delegation
      allow:
        - objectstore.read
        - identity.whoami
      deny:
        - objectstore.write
        - keyvalue.read
        - keyvalue.write
        - identity.delegate

    - kind: task_contract
      task: two-step-pipeline
