apiVersion: chainbreak.dev/v1alpha1
kind: Scenario

metadata:
  id: nc-stale-credential-reuse
  version: 1.0.0
  family: stale-authority
  title: Negative control -- deferred phase deliberately reuses a pre-mutation credential
  description: >
    Validates the STALE_AUTHORITY detector and, critically, the paired
    fresh-credential disambiguation. The deferral is short (20 s) so that the
    trust-policy change blocks future issuance while the deferred phase pins
    the pre-mutation credential. CHAINBREAK must classify the outcome using
    the pinned session and the failed fresh-issuance leg rather than a single
    deferred result.
  authors: [operator]
  tags: [negative-control, stale, paired-credential]

spec:
  provider: aws
  requires:
    catalog_version: ">=1.0.0,<2.0.0"
    adapter_version: ">=0.1.0"
    infrastructure_profile: standard

  execution:
    trials: 1
    timing_sensitive: true
    concurrency: 1
    max_duration_seconds: 600
    probe_universe: declared

  identities:
    - id: principal
      role: root
      provider_binding:
        terraform_output: principal_role_arn
      capabilities:
        - objectstore.read
        - identity.whoami
        - identity.delegate

    - id: agent-a
      role: agent
      provider_binding:
        terraform_output: agent_a_role_arn

    - id: agent-b
      role: agent
      provider_binding:
        terraform_output: agent_b_role_arn

    - id: agent-c
      role: agent
      provider_binding:
        terraform_output: agent_c_stale_role_arn

  delegations:
    - id: hop-1
      from: principal
      to: agent-a
      mechanism: ROLE_CHAIN
      intended_capabilities:
        - objectstore.read
        - identity.whoami
        - identity.delegate
      credential:
        requested_lifetime_seconds: 3600

    - id: hop-2
      from: agent-a
      to: agent-b
      mechanism: SESSION_POLICY_SCOPED
      intended_capabilities:
        - objectstore.read
        - identity.whoami
        - identity.delegate
      session_policy:
        derive_from: intended_capabilities
      credential:
        requested_lifetime_seconds: 3600

    - id: hop-3
      from: agent-b
      to: agent-c
      mechanism: SESSION_POLICY_SCOPED
      intended_capabilities:
        - objectstore.read
        - identity.whoami
      session_policy:
        derive_from: intended_capabilities
      credential:
        requested_lifetime_seconds: 3600

  phases:
    - name: after-delegation
      kind: PROBE
      targets: [agent-c]

    - name: revoke
      kind: MUTATE
      mutation:
        target_identity: agent-c
        kind: UPDATE_TRUST_POLICY
        record_receipt: true

    - name: short-defer
      kind: WAIT
      wait_seconds: 20

    - name: deferred-old-credential
      kind: DEFERRED_EXECUTION
      target_identity: agent-c
      credential_source: phase:after-delegation

  negative_control:
    kind: STALE_CREDENTIAL_REUSE
    rationale: >
      The deferred phase pins the credential minted before the trust-policy
      mutation. The old session remains usable, while the paired fresh
      issuance is denied by the changed trust policy. That is the AWS form of
      stale authority: an already-issued credential remains live after future
      issuance is blocked. The detector must retain the failed fresh-issuance
      leg instead of treating the run as an infrastructure error.
    expect_finding:
      type: STALE_AUTHORITY
      identity: agent-c
      capabilities: [objectstore.read]
      min_confidence: LOW
