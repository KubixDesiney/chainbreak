[build-system]
# >=1.27: PEP 639 support (SPDX `license` expression and `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chainbreak"
version = "0.1.1"
description = "An empirical benchmark for authorization behavior in delegated and agentic cloud systems"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CHAINBREAK contributors" }]
keywords = ["security", "iam", "authorization", "aws", "sts", "delegation", "benchmark"]
# No "License :: ..." classifier: the SPDX `license` expression above supersedes it,
# and declaring both is an error under PEP 639.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.34",
  "botocore>=1.34",
]
report = [
  "jinja2>=3.1",
]
# No charting library. reporting/figures.py builds inline SVG programmatically from
# evidence -- see docs/DECISIONS.md. Plotly was declared here and never imported;
# removed 2026-08-19 because an unused declared dependency is pure attack surface
# (THREAT_MODEL.md T-14).
analysis = [
  "pyarrow>=16.0",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "freezegun>=1.5",
  "moto[sts,s3,iam,dynamodb,awslambda,sqs]>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
  "boto3-stubs[s3,sts,iam,dynamodb,lambda,sqs]",
  "import-linter>=2.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
chainbreak = "chainbreak.cli.main:app"

[project.urls]
Homepage = "https://github.com/KubixDesiney/chainbreak"
Repository = "https://github.com/KubixDesiney/chainbreak"
Documentation = "https://github.com/KubixDesiney/chainbreak/blob/main/ARCHITECTURE.md"
Changelog = "https://github.com/KubixDesiney/chainbreak/blob/main/CHANGELOG.md"
Issues = "https://github.com/KubixDesiney/chainbreak/issues"
Security = "https://github.com/KubixDesiney/chainbreak/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/chainbreak"]

[tool.hatch.build.targets.wheel.force-include]
schemas = "chainbreak/_packaged_data/schemas"
scenarios = "chainbreak/_packaged_data/scenarios"

# ---------------------------------------------------------------------------
# sdist -- an explicit allowlist, deliberately not an exclude list.
#
# Hatchling's default selection is "every file under the project root that
# .gitignore does not match", which includes untracked files. Under v0.1.0 that
# swept .claude/worktrees/ into the tarball: 744 untracked files, 4.83 MB, 48%
# of the unpacked sdist, being two stale duplicates of the working tree. No
# credential or account ID reached it, but the contents of a published sdist
# became a function of whichever files happened to sit in the builder's working
# directory, not of the tagged commit -- so the same tag built on a clean clone
# produces a different tarball. That contradicts REPRODUCIBILITY.md.
#
# An allowlist makes every path in a published artifact a reviewed decision, and
# fails closed: a new top-level directory is absent until someone adds it here.
# Adding a directory to the repository root therefore requires a line below.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scenarios",
  "/schemas",
  "/infra",
  "/docs",
  "/scripts",
  "/examples",
  "/.github",
  "/*.md",
  "/LICENSE",
  "/NOTICE",
  "/Makefile",
  "/Dockerfile",
  "/pyproject.toml",
  "/requirements.lock",
  "/requirements-build.lock",
  "/requirements-runtime.lock",
  "/chainbreak.example.toml",
  "/.pre-commit-config.yaml",
  "/.gitattributes",
  "/.dockerignore",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pure logic, no I/O, no cloud, no network (default CI layer)",
  "integration: full scenario execution against the deterministic fake provider",
  "aws: requires a real, operator-owned AWS benchmark account (never runs in default CI)",
  "e2e: provisions and destroys real infrastructure; long-running and billable",
  "slow: takes more than 5 seconds",
]
# AWS and e2e layers are opt-in only.
# CI runs: pytest -m "unit or integration"

[tool.coverage.run]
branch = true
source = ["src/chainbreak"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle / pyflakes
  "I",              # isort
  "N",              # pep8-naming
  "UP",             # pyupgrade
  "B",              # bugbear
  "A",              # builtins shadowing
  "C4",             # comprehensions
  "DTZ",            # naive datetime usage -- important: all timestamps must be tz-aware
  "T20",            # no print() outside reporting layer
  "SIM",
  "PTH",
  "RUF",
  "S",              # bandit
]
ignore = [
  "S101",  # assert is allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/chainbreak/reporting/**" = ["T20"]
# Operator-facing setup scripts: printing to the terminal is the entire point,
# and the subprocess arguments are built from argparse values, not free input.
"scripts/**" = ["T20", "S603"]
"src/chainbreak/cli/**" = ["T20"]  # the CLI layer's whole job is printing to the terminal
# A standalone `python -m` diagnostic entry point, not the CLI proper --
# M06-evidence-pipeline.md's own verification command names it directly.
"src/chainbreak/evidence/verify.py" = ["T20"]
# _SCHEMA_SQL preserves schemas/run-index.sql's exact line breaks so
# test_evidence_schema.py can assert the two stay byte-identical; wrapping a
# CHECK constraint across lines here would desync them for no benefit.
"src/chainbreak/evidence/index.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["chainbreak"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented API calls Option()/Argument() as the parameter default
# itself; these are evaluated once at import time and are safe (Typer's own
# examples use exactly this pattern), so B008 would otherwise flag every CLI
# command's signature.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["src/chainbreak"]

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter -- enforces ARCH-1, the layer dependency rule
# (ARCHITECTURE.md section 2). A violation here is a build failure.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "chainbreak"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ARCH-1: result layers may only import downward"
type = "layers"
layers = [
  "chainbreak.cli",
  "chainbreak.reporting",
  "chainbreak.scoring",
  "chainbreak.analysis",
  "chainbreak.evidence",
  "chainbreak.execution",
  "chainbreak.graph",
  "chainbreak.core",
]

[[tool.importlinter.contracts]]
name = "ARCH-1: provider adapters depend only on providers.base"
type = "layers"
layers = [
  "chainbreak.providers.aws | chainbreak.providers.fake",
  "chainbreak.providers.base",
]

[[tool.importlinter.contracts]]
name = "ARCH-1: scenarios depends only on capabilities and core"
type = "layers"
layers = [
  "chainbreak.scenarios",
  "chainbreak.capabilities",
  "chainbreak.core",
]

[[tool.importlinter.contracts]]
name = "ARCH-1: core imports nothing from chainbreak"
type = "forbidden"
source_modules = ["chainbreak.core"]
forbidden_modules = [
  "chainbreak.cli",
  "chainbreak.config",
  "chainbreak.scenarios",
  "chainbreak.capabilities",
  "chainbreak.graph",
  "chainbreak.providers",
  "chainbreak.execution",
  "chainbreak.evidence",
  "chainbreak.analysis",
  "chainbreak.scoring",
  "chainbreak.reporting",
]

[[tool.importlinter.contracts]]
name = "ARCH-1: graph imports only core"
type = "forbidden"
source_modules = ["chainbreak.graph"]
forbidden_modules = [
  "chainbreak.cli",
  "chainbreak.config",
  "chainbreak.scenarios",
  "chainbreak.capabilities",
  "chainbreak.providers",
  "chainbreak.execution",
  "chainbreak.evidence",
  "chainbreak.analysis",
  "chainbreak.scoring",
  "chainbreak.reporting",
]

[[tool.importlinter.contracts]]
name = "ARCH-1: boto3 is confined to providers.aws"
type = "forbidden"
# chainbreak.cli is deliberately absent here: ARCHITECTURE.md's own
# dependency rule (INVARIANT ARCH-1) states "cli -> everything" -- the CLI
# is the dispatch point that must be able to call into whichever provider a
# command needs (M9's `chainbreak infra verify-clean` and `status` are the
# first commands that actually exercise this; M10's `chainbreak run
# --provider aws` will too). Every module below cli/ in the layering stays
# forbidden from reaching boto3/botocore at all, transitively -- the actual
# invariant this contract protects is "no AWS-specific knowledge leaks into
# the domain/analysis layers," not "the CLI may never dispatch to the AWS
# provider."
source_modules = [
  "chainbreak.config",
  "chainbreak.core",
  "chainbreak.capabilities",
  "chainbreak.scenarios",
  "chainbreak.graph",
  "chainbreak.providers.base",
  "chainbreak.providers.fake",
  "chainbreak.execution",
  "chainbreak.evidence",
  "chainbreak.analysis",
  "chainbreak.scoring",
  "chainbreak.reporting",
]
forbidden_modules = ["boto3", "botocore"]
