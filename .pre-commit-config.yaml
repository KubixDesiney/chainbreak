repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        files: ^src/chainbreak/
        pass_filenames: false

      - id: import-linter
        name: import-linter (ARCH-1)
        entry: lint-imports
        language: system
        pass_filenames: false

      - id: no-aws-credentials
        name: no AWS access-key-shaped strings
        language: pygrep
        entry: '(AKIA|ASIA)[0-9A-Z]{16}'
        exclude: ^tests/
